# XcodeGen spec. CI runs `xcodegen generate` on the macOS runner (no Mac locally).
name: ConorMastery
options:
  bundleIdPrefix: com.conorfee
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 6VBFL287PT
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MasteryCore:
    path: MasteryCore
targets:
  ConorMastery:
    type: application
    platform: iOS
    sources:
      - App/ConorMastery
      - Shared
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: MasteryCore
      - target: MasteryMonitor
      - target: MasteryWidgets
    entitlements:
      path: App/ConorMastery.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.conorfee.conormastery]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mastery
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [conormastery]
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        # NO in the TestFlight build signed without Family Controls (release.yml); see ScreenTimeService.isAvailable.
        MasteryScreenTime: $(MASTERY_SCREEN_TIME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conorfee.conormastery
        MASTERY_SCREEN_TIME: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: Conor Mastery AppStore
  MasteryMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/MasteryMonitor
      # The monitor only needs the gate; widget and Live Activity types stay out of it.
      - path: Shared
        excludes: ["Widget/**"]
    dependencies:
      - package: MasteryCore
    entitlements:
      path: Extensions/MasteryMonitor/MasteryMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.conorfee.conormastery]
    info:
      path: Extensions/MasteryMonitor/Info.plist
      properties:
        CFBundleDisplayName: Mastery Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MasteryMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conorfee.conormastery.monitor
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: Conor Mastery Monitor AppStore
  MasteryWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/MasteryWidgets
      - Shared/Widget
      # Sprites for the hero (belt colours); the app icon set in it is ignored by the extension.
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    entitlements:
      path: Extensions/MasteryWidgets/MasteryWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.conorfee.conormastery]
    info:
      path: Extensions/MasteryWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mastery Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conorfee.conormastery.widgets
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: Conor Mastery Widgets AppStore
  ConorMasteryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/ConorMasteryTests]
    dependencies:
      - target: ConorMastery
  # Release-gate tour: the kit's Tour.swift, copied unchanged (the gate checks it). Gate/ holds the manifest.
  ConorMasteryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ConorMasteryUITests
        excludes: ["Gate/**"]
    dependencies:
      - target: ConorMastery
    settings:
      base:
        TEST_TARGET_NAME: ConorMastery
schemes:
  ConorMastery:
    build:
      targets:
        ConorMastery: all
    test:
      targets: [ConorMasteryTests, ConorMasteryUITests]
