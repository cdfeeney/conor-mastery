name: ios

# Manual only: macOS minutes are expensive (owner gate, same as ConorHealth).
on:
  workflow_dispatch:
  # release.yml runs these same tests before the gate and the upload.
  workflow_call:

jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: MasteryCore tests
        working-directory: MasteryCore
        run: swift test

  app:
    runs-on: macos-15
    timeout-minutes: 30
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # Runner images sometimes ship without a named iPhone simulator (run 39059434484): use any available
      # iPhone, else create one on the newest iOS runtime.
      - name: Pick a simulator
        id: sim
        run: |
          # Only runtimes the active Xcode's SDK can target (newer simulator runtimes may be installed too).
          export SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          runtime=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, os, sys
          v = lambda s: tuple(int(p) for p in s.split("."))
          sdk = v(os.environ["SDK_VERSION"])
          ok = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and v(r["version"]) <= sdk]
          print(max(ok, key=lambda r: v(r["version"]))["identifier"] if ok else "")')
          echo "SDK $SDK_VERSION, runtime $runtime"
          udid=$(xcrun simctl list devices available -j | RUNTIME="$runtime" python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"].get(os.environ["RUNTIME"], [])
          print(next((d["udid"] for d in devices if d["name"].startswith("iPhone")), ""))')
          if [ -z "$udid" ]; then
            udid=$(xcrun simctl create "CI iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$runtime")
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild test \
            -project ConorMastery.xcodeproj -scheme ConorMastery \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:ConorMasteryUITests \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
