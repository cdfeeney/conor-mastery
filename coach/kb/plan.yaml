weekly_focus: "Foundations first: sleep and phone. Lock those in, then body, then focus."
order: [morning-routine, sleep, meditation, workout, reset-focus, deep-breathing, no-social-media, no-nicotine, night-routine]
notes:
  - "Habits take about 2 months to feel automatic (median ~66 days, range 18-254), not 21. Expect week 3 to feel hard. (res:lally2010)"
  - "A written when-and-where plan has a medium-to-large effect on follow-through (d=0.65). (res:gollwitzer2006)"
  - "Never miss twice. One missed day is noise; two is the start of a new habit. (James Clear, yt:mNeXuCYiE0U @ 20:00)"
  - "On a bad day, do the Min version. A rep is a vote for who you are becoming. (yt:U_nzqnXWvSo @ 06:38)"
  - "Plans beat motivation: every habit has a when and where. Set them in Today. (yt:mNeXuCYiE0U @ 06:44)"
